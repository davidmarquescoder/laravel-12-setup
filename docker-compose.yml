services:
    app:
        container_name: laravel-app
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - redis
        networks:
            - public_network

    nginx:
        container_name: laravel-nginx
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - public_network

    db:
        container_name: laravel-db
        image: mysql:8.3
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-userpass}
            MYSQL_USER: ${DB_USERNAME:-username}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            - "3388:3306"
        networks:
            - public_network

    queue:
        container_name: laravel-queue
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        command: php artisan queue:listen
        volumes:
            - ./:/var/www
        depends_on:
            - app
        networks:
            - public_network

    reverb:
        container_name: laravel-reverb
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        command: php artisan reverb:start
        ports:
            - "8080:8080"
        volumes:
            - ./:/var/www
        depends_on:
            - app
        networks:
            - public_network

    phpmyadmin:
        container_name: laravel-myadmin
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        ports:
            - "6060:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-userpass}
        networks:
            - public_network

    redis:
        container_name: laravel-redis
        image: redis:latest
        networks:
            - public_network

networks:
    public_network:
        driver: bridge
    private_network:
        driver: bridge
